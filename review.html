  <h2>涨停质量</h2>
  <div class="hint">排序：连板高度 ↓ → 封板分 ↓ → 首封时间 ↑&nbsp;&nbsp;｜&nbsp;&nbsp;封板分 = 50 + 早封(≤10:00 +20) − 炸板(每次−5，最多−25) + 量比(±10~15) + 连板 +5 + 成交额≥5亿 +5&nbsp;&nbsp;｜&nbsp;&nbsp;悬浮分数看这只票的构成</div>
  <div class="tablewrap"><table id="qualityTable">
    <thead><tr><th>股票</th><th>连板</th><th>首封</th><th>炸板</th><th>换手</th><th>5日量比</th><th>封板分</th><th class="lead">原因</th></tr></thead>
    <tbody id="qualityRows"></tbody>
  </table></div>
  <div class="rcards" id="qualityCards" style="padding:0 14px"></div>

  <h2>板块状态</h2>
  <div class="hint">状态由涨停家数、最高板、较昨日变化推出来；不是买卖建议。</div>
  <div class="tablewrap"><table id="stateTable">
    <thead><tr><th>板块</th><th>涨停</th><th>最高</th><th class="lead">状态</th><th class="lead">龙头</th><th>较昨</th></tr></thead>
    <tbody id="stateRows"></tbody>
  </table></div>
  <div class="rcards" id="stateCards" style="padding:0 14px"></div>
